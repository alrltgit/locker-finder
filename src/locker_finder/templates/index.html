<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        * { box-sizing: border-box; }
        #map { height:100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>

        console.log("TEST-1")

        var map = L.map('map').setView([52.1943, 21.0122], 13)

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        console.log("TEST")

        const user_lat = 52.1943
        const user_lon = 21.0122

        console.log("TEST0")

        fetch(`/api/lockers/nearest?lat=${user_lat}&lon=${user_lon}`)
            .then(response => response.json())
            .then(data => {
                console.log("Data: ", data)
                data.forEach(locker => {
<!--                    console.log("locker["lat"]: ", locker["lat"])-->
<!--                    console.log("locker["lon"]: ", locker["lon"])-->
                    L.marker([locker["lat"], locker["lon"]])
                    .addTo(map)
                    .bindPopup(locker["name"])
                });
            });
        console.log("TEST1")

    </script>
</body>
</html>
