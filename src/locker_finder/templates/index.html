<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map {
            height: 80vh;
            width: 80%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([51.9194, 19.1451], 6)

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);


        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const user_lat = position.coords.latitude
                    const user_lon = position.coords.longitude

                    console.log(user_lat)
                    console.log(user_lon)

                    map.setView([user_lat, user_lon], 13)

                    fetch(`/api/lockers/nearest?lat=${user_lat}&lon=${user_lon}`)
                        .then(response => response.json())
                        .then(data => {
                            data.forEach(locker => {
                                if (locker["lat"] && locker["lon"]) {
                                    L.marker([locker["lat"], locker["lon"]])
                                    .addTo(map)
                                    .bindPopup(locker["name"])
                                }
                            });
                        });
                },
                (error) => {
                    console.error("Geolocation error:", error.message)
                }
            );
        } else {
            console.error("Geolocation is not supported by this browser")
        }
    </script>
</body>
</html>
