[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locker-finder"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "flask>=3.1",
    "sqlmodel>=0.0.38",
    "sqlmodel-slim>=0.0.35"
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "black",
    "ruff"
]
